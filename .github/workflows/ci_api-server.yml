name: CI — api-server

on:
  push:
    paths:
      - "services/api-server/**"
      - ".github/workflows/ci_api-server.yml"
  pull_request:
    paths:
      - "services/api-server/**"
      - ".github/workflows/ci_api-server.yml"

jobs:
  check:
    name: Vet, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: services/api-server/go.sum

      - name: Check (vet + build + test)
        run: make check
